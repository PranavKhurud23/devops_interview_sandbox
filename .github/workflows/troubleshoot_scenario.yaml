name: "Devops SRE Troubleshoot Question Practice"
on:
  workflow_dispatch:
permissions: 
  contents: read
  id-token: write
jobs:
  run-troubleshoot-job:
     name: "Run the Workflow"
     runs-on: ubuntu-latest
     steps:
        - name: Test workflow
          run: echo "Hello Troubleshoot workflow"
        - name: Checkout the code
          uses: actions/checkout@v4
        - name: Authorization to GCP
          uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        - name: connect to GKE Cluster
          uses: google-github-actions/get-gke-credentials@v2
          with:
            cluster_name: 'devops-gke-cluster'
            location: 'asia-south1'
       # ========================================================================
      # SCENARIO 1: 502/504 GATEWAY ERRORS DIAGNOSTIC RUNBOOK
      # Users reporting intermittent 502 Bad Gateway / 504 Gateway Timeout errors from 
      # an Ingress controller pointing to an expense-tracker-web service.
      # =======================================================================
        - name: "Step 1: Inspect Ingress Log for 502/504 Errors"
          run: |
               echo "=== Checking Ingress Controller Logs =="
               #kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --tail=200 | grep -E "502|504"
               kubectl get ingress -n default || echo "No Ingress Found"

        - name: "Step 2: Check Pod and Endpoint Status"
          run: | 
               echo "Checking pod healthy in defaultnamespace"
               kubectl get pods -n default -o wide -l app=expense-tracker

        - name: "Step 3: Check Pod Resource usage and Restart"
          run: |
               echo "Checking pod resource Usage & Restart"
               kubectl top pods -n default -l app=expense-tracker || echo "Metrics Server not ready/installed."

        - name: "Step 4: Check Liveness / Readiness Probe Failures"
          run: |
               echo "=== INSPECTING EVENTS FOR PROBE / SCHEDULING FAILURES ==="
               kubectl get events -n default --sort-by='.metadata.creationTimestamp' | tail -n 20

        - name: "Step 5: Verify Application Container Logs"
          run: |
               echo "CHECKING RECENT APPLICATION LOGS"
               kubectl logs -n default -l app=expense-tracker --tail=100 --all-containers=true

        - name: "Step 6: \n=== CHECKING FOR RECENT RESTARTS === "
          run: |
               echo "=== INSPECTING EVENTS FOR PROBE / SCHEDULING FAILURES ==="
               kubectl get events -n default --sort-by='.metadata.creationTimestamp' | tail -n 20

        # =====================================================================
# SCENARIO 2: UNHEALTHY PODS / INTERMITTENT 502 BAD GATEWAY
# ---------------------------------------------------------------------
# Scenario Details:
# - Users report intermittent 502 Bad Gateway at /checkout route.
# - Pod status shows READY: 0/1 and RESTARTS > 0 for one replica.
# - Goal: Identify why the pod is failing readiness probes or crashing.
# =====================================================================

        - name: "Scenario 2 - Step 1: Check Registered Endpoints"
          run: |
              echo "Check Active Endpoints"
              kubectl get endpoints -n default -l app=expense-tracker

        - name: "Sc 2 - Step 2: Describe POD Events and Probe Failure"
          run: |
              echo "Check Pod Events & Probe Status"
              kubectl describe pods -n default -l app=expense-tracker

        - name: "Sc 2 - Step 3: Fetch Container Logs Before Last Crash"
          run: |
              echo "Inspect previous logs for Crash Analysis"
              kubectl logs -n default -l app=expense-tracker --previous --tail=100 || echo "No Previous Crashed Logs Found"
 
              
 
     
      

      

               
               
               
             
               
