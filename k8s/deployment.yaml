apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-web
  labels:
    app: expense-tracker-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker-web
  template:
    metadata:
      labels:
        app: expense-tracker-web
    spec:
      containers:
      - name: web
        image: asia-south1-docker.pkg.dev/project-3abb875e-b867-4aaf-843/expense-repo/expense-tracker-web:latest
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: expense-tracker-config   # Inject ConfigMap keys as environment variables
        volumeMounts:                      #Scnenario 8 ass PVC mount to POD as without this PVC went into pending state
          - name: storage-volume
            mountPath: /app/data
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
              claimName: expense-tracker-pvc      
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
