apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: expense-tracker-service
            port:
              #number: 8080   # ❌ INTENTIONAL FAULT: Service port is actually 80!
              number: 80    # ✅ FIXED: Matches service.yaml spec.ports[0].port
